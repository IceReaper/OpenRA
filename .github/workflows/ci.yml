name: Continuous Integration

on:
  push:
  pull_request:
    branches: [ bleed, 'prep-*' ]

permissions:
  contents: read  #  to fetch code (actions/checkout)

jobs:
  linux:
    name: Linux (.NET 9.0)
    runs-on: ubuntu-24.04

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Check Code
        run: |
          dotnet run --project OpenRA.Game.Dune2000 --utility --check-yaml
          dotnet run --project OpenRA.Game.RedAlert --utility --check-yaml
          dotnet run --project OpenRA.Game.TiberianDawn --utility --check-yaml
          dotnet run --project OpenRA.Game.TiberianSun --utility --check-yaml
          dotnet test OpenRA.Test --test-adapter-path:.

      - name: Check Mods
        run: |
          sudo apt-get install lua5.1
          find . -type f -name "*.lua" -exec luac -p {} \;
          dotnet test OpenRA.Test --test-adapter-path:.

  windows:
    name: Windows (.NET 9.0)
    runs-on: windows-2025

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Check Code
        shell: powershell
        run: |
          dotnet run --project OpenRA.Game.Dune2000 --utility --check-yaml
          dotnet run --project OpenRA.Game.RedAlert --utility --check-yaml
          dotnet run --project OpenRA.Game.TiberianDawn --utility --check-yaml
          dotnet run --project OpenRA.Game.TiberianSun --utility --check-yaml
          dotnet test OpenRA.Test --test-adapter-path:.

      - name: Check Mods
        run: |
          choco install lua --version 5.1.5.52
          $ENV:Path = $ENV:Path + ";C:\Program Files (x86)\Lua\5.1\"
          Get-ChildItem -Recurse -Filter *.lua | ForEach-Object { & luac -p $_.FullName }
          dotnet test OpenRA.Test --test-adapter-path:.
